<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Quiet colours. Clear purpose."><rect width="1200" height="600" rx="28" fill="#E5E9EA"/><style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#172F3C;font-size:30px;font-weight:700}.body{fill:#172F3C;font-size:21px}.muted{fill:#4E6572;font-size:17px}.small{fill:#4E6572;font-size:14px}.card{fill:#F1F3F3;stroke:#BDCCD1;stroke-width:1}</style><text x="42" y="49" class="small" letter-spacing="3">ARDIMENT · PRODUCT WALKTHROUGH</text><text x="42" y="100" class="title">Quiet colours. Clear purpose.</text><text x="42" y="135" class="muted">The same connected work, with a softer visual rhythm.</text><rect x="42" y="178" width="546" height="148" rx="20" class="card"/><rect x="66" y="203" width="6" height="88" rx="3" fill="#367F8D"/><text x="94" y="239" class="title">Capture</text><text x="94" y="279" class="muted">Write the task while it is fresh.</text><rect x="612" y="178" width="546" height="148" rx="20" class="card"/><rect x="636" y="203" width="6" height="88" rx="3" fill="#7967A5"/><text x="664" y="239" class="title">Plan</text><text x="664" y="279" class="muted">Give it a date and enough time.</text><rect x="42" y="350" width="546" height="148" rx="20" class="card"/><rect x="66" y="375" width="6" height="88" rx="3" fill="#517E6A"/><text x="94" y="411" class="title">Focus</text><text x="94" y="451" class="muted">Open the next unfinished step.</text><rect x="612" y="350" width="546" height="148" rx="20" class="card"/><rect x="636" y="375" width="6" height="88" rx="3" fill="#9B784B"/><text x="664" y="411" class="title">Complete</text><text x="664" y="451" class="muted">Record the work you finished.</text><text x="42" y="570" class="small">Illustrative product guide · Fictional examples · Not an application screenshot</text></svg>
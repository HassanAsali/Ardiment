<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="255" viewBox="0 0 1280 255" role="img" aria-labelledby="title desc"><title id="title">Ardiment — recorded release evidence</title><desc id="desc">24 automated suites passed for 0.7.1.1. Sampled English and Arabic interface QA for 0.7. Physical devices and live production services remain separate acceptance work.</desc><rect x="1" y="1" width="1278" height="253" rx="22" fill="#0b1825" stroke="#263c50"/><g font-family="DejaVu Sans, Arial, sans-serif"><path d="M425 38V184M850 38V184" stroke="#263c50"/><text x="38" y="86" fill="#52e8ff" font-size="49" font-weight="bold">24 suites</text><text x="38" y="125" fill="#eef4ff" font-size="16" font-weight="bold">AUTOMATED COMMAND PASSED</text><text x="38" y="156" fill="#a6bdd0" font-size="14">0.7.1.1 / static, unit, mocked services</text><text x="462" y="86" fill="#b7a7ff" font-size="39" font-weight="bold">EN + AR</text><text x="462" y="125" fill="#eef4ff" font-size="16" font-weight="bold">SAMPLED INTERFACE QA</text><text x="462" y="156" fill="#a6bdd0" font-size="14">0.7 / actual UI, synthetic fixture data</text><text x="887" y="86" fill="#e9b58a" font-size="39" font-weight="bold">Still to verify</text><text x="887" y="125" fill="#eef4ff" font-size="16" font-weight="bold">PHYSICAL DEVICES + LIVE CLOUD</text><text x="887" y="156" fill="#a6bdd0" font-size="14">Installation, push, production acceptance</text><path d="M38 193H1242" stroke="#263c50"/><text x="38" y="229" fill="#9db4c8" font-size="12" letter-spacing="1">RECORDED RELEASE EVIDENCE / NOT LIVE CI OR A SECURITY CERTIFICATION</text></g></svg>